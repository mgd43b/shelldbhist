[package]
name = "sdbh"
version = "1.0.2"
edition = "2024"
repository = "https://github.com/mgd43b/shelldbhist"
license = "MIT"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.58", features = ["derive"] }
# (Optional) used to resolve ~/.sdbh.toml robustly.
dialoguer = "0.12.0"
dirs = "6.0.0"
regex = "1.12.3"
rusqlite = { version = "0.38.0" }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
terminal_size = "0.4"
thiserror = "2.0.17"
time = { version = "0.3.47", features = ["formatting", "macros"] }
toml = "0.9.11"
uuid = { version = "1.20", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3.25.0"

# The profile that 'dist' will build with
# NOTE: This must live at the *workspace root* Cargo.toml to be honored.
# Kept here for reference; see ../Cargo.toml.
#
# [profile.dist]
# inherits = "release"
# lto = "thin"