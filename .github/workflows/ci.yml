name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sdbh -> target

      - name: fmt
        run: cd sdbh && cargo fmt --check

      - name: clippy
        run: cd sdbh && cargo clippy -- -D warnings

      - name: test
        run: cd sdbh && cargo test

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage
        run: cd sdbh && cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: sdbh/lcov.info
          flags: rust
          name: codecov-umbrella

  dependabot-automerge:
    name: Dependabot Auto-Merge
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      github.actor == 'dependabot[bot]' && 
      github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch/minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
          echo "Auto-merge enabled for ${{ steps.metadata.outputs.update-type }} update"
          echo "Will merge automatically when all required checks pass"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "${{ github.event.pull_request.html_url }}" --body "Major version update detected - requires manual review before merge. This update may contain breaking changes. Please review the changelog/release notes, verify CI passes, and manually approve and merge when ready."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
